services:
  v6:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v6-quant-lab
    restart: unless-stopped
    env_file:
      - .env.oracle
    environment:
      V6_DATA_DIR: /data
      PORT: 8501
      V6_ALLOW_PAPER_ORDERS: "0"
    volumes:
      - /opt/v6-data:/data
    ports:
      - "80:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
