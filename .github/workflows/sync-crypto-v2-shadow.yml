name: Sync Crypto V2 shadow snapshot

on:
  push:
    paths:
      - '.github/workflows/sync-crypto-v2-shadow.yml'
  schedule:
    # Stagger from the main research snapshot job so both jobs do not normally
    # push snapshot-data at the same instant.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-crypto-v2-shadow
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout snapshot branch
        uses: actions/checkout@v5
        with:
          ref: snapshot-data
          fetch-depth: 0

      - name: Fetch and validate Crypto V2 shadow snapshot
        shell: bash
        run: |
          set -euo pipefail
          url='https://v6-quant-lab-production.up.railway.app/app/static/crypto_v2_shadow_snapshot.json'
          tmp="$(mktemp)"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "$url" -o "$tmp"; then
              ok=1
              break
            fi
            echo "Crypto V2 snapshot not ready (attempt ${attempt}/6)."
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Crypto V2 snapshot unavailable.' >&2
            exit 1
          fi

          python - "$tmp" <<'PY'
          import json, pathlib, sys
          from datetime import datetime, timezone

          src = pathlib.Path(sys.argv[1])
          data = json.loads(src.read_text(encoding='utf-8'))
          if data.get('contains_secrets') is not False:
              raise SystemExit('Crypto V2 secret-safety flag missing or unsafe')
          if str(data.get('scope') or '') != 'PUBLIC_READ_ONLY_CRYPTO_V2_SHADOW':
              raise SystemExit('Unexpected Crypto V2 snapshot scope')
          if int(data.get('broker_order_api_calls', -1)) != 0:
              raise SystemExit('Crypto V2 broker API safety invariant violated')
          if int(data.get('market_data_api_calls', -1)) != 0:
              raise SystemExit('Crypto V2 must remain shared-cache-only')
          if data.get('persistent_checkpoint') is not True:
              raise SystemExit('Crypto V2 persistent checkpoint is not healthy')

          generated = data.get('generated_at')
          if not generated:
              raise SystemExit('Crypto V2 generated_at missing')
          generated_dt = datetime.fromisoformat(str(generated).replace('Z', '+00:00'))
          if generated_dt.tzinfo is None:
              generated_dt = generated_dt.replace(tzinfo=timezone.utc)
          now = datetime.now(timezone.utc)
          age = max(0.0, (now - generated_dt.astimezone(timezone.utc)).total_seconds())
          if age > 300:
              raise SystemExit(f'Crypto V2 runtime snapshot is stale: {age:.1f}s old')

          data['sync_checked_at'] = now.isoformat()
          data['sync_snapshot_age_seconds'] = age
          pathlib.Path('crypto_v2_shadow_snapshot.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Commit snapshot to snapshot-data only
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- crypto_v2_shadow_snapshot.json)" ]; then
            echo 'No Crypto V2 snapshot changes.'
            exit 0
          fi
          git config user.name 'v6-snapshot-bot'
          git config user.email 'v6-snapshot-bot@users.noreply.github.com'
          git add crypto_v2_shadow_snapshot.json
          git commit -m 'Update Crypto V2 shadow snapshot'

          # research_snapshot.json is written by a separate scheduled workflow on
          # the same branch. Rebase-and-retry prevents harmless concurrent updates
          # to different files from leaving the V2 snapshot stale.
          for attempt in 1 2 3; do
            git pull --rebase origin snapshot-data
            if git push origin HEAD:snapshot-data; then
              exit 0
            fi
            echo "snapshot-data moved during push (attempt ${attempt}/3); retrying."
            sleep 5
          done
          echo 'Unable to update Crypto V2 snapshot after retries.' >&2
          exit 1
