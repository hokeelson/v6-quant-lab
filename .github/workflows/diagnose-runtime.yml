name: Diagnose runtime snapshots

on:
  push:
    paths:
      - '.github/workflows/diagnose-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout snapshot branch
        uses: actions/checkout@v5
        with:
          ref: snapshot-data
          fetch-depth: 0

      - name: Probe public Railway snapshots
        shell: bash
        run: |
          set -euo pipefail
          base='https://v6-quant-lab-production.up.railway.app/app/static'
          v2="$(mktemp)"
          research="$(mktemp)"
          health="$(mktemp)"
          v2_status='ERROR'
          research_status='ERROR'
          health_status='ERROR'

          if curl --fail --silent --show-error --location --max-time 30 "$base/crypto_v2_shadow_snapshot.json" -o "$v2"; then
            v2_status='OK'
          fi
          if curl --fail --silent --show-error --location --max-time 30 "$base/research_snapshot.json" -o "$research"; then
            research_status='OK'
          fi
          if curl --fail --silent --show-error --location --max-time 30 "$base/runtime_health.json" -o "$health"; then
            health_status='OK'
          fi

          python - "$v2" "$research" "$health" "$v2_status" "$research_status" "$health_status" <<'PY'
          import json, pathlib, sys
          from datetime import datetime, timezone

          def read(path, status):
              if status != 'OK':
                  return None
              try:
                  d = json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
                  return d if isinstance(d, dict) else None
              except Exception:
                  return None

          v2 = read(sys.argv[1], sys.argv[4])
          research = read(sys.argv[2], sys.argv[5])
          health = read(sys.argv[3], sys.argv[6])

          if v2 is None:
              v2_out = {'http': 'ERROR'}
          else:
              layer = v2.get('research_layer') or {}
              excursion = layer.get('trade_excursion_tracking') or {}
              counterfactual = layer.get('risk_block_counterfactual') or {}
              bidirectional = layer.get('bidirectional_decision_shadow') or {}
              registration = layer.get('bidirectional_registration') or {}
              v2_out = {
                  'http': 'OK',
                  'generated_at': v2.get('generated_at'),
                  'status': v2.get('status'),
                  'catchup': v2.get('catchup'),
                  'persistent_checkpoint': v2.get('persistent_checkpoint'),
                  'scope': v2.get('scope'),
                  'broker_order_api_calls': v2.get('broker_order_api_calls'),
                  'market_data_api_calls': v2.get('market_data_api_calls'),
                  'research_layer_present': bool(layer),
                  'tracked_research_trades': excursion.get('tracked_closed_trades'),
                  'active_blocked_candidates': counterfactual.get('active_candidates'),
                  'external_signals': layer.get('external_signals'),
                  'bidirectional_shadow': {
                      'status': bidirectional.get('status'),
                      'method': bidirectional.get('method'),
                      'total_decisions': bidirectional.get('total_decisions'),
                      'active_evaluations': bidirectional.get('active_evaluations'),
                      'closed_evaluations': bidirectional.get('closed_evaluations'),
                      'decision_accuracy': bidirectional.get('decision_accuracy'),
                      'by_selected_action': bidirectional.get('by_selected_action'),
                      'changes_v2_execution': bidirectional.get('changes_v2_execution'),
                      'ev_is_calibrated': bidirectional.get('ev_is_calibrated'),
                      'registration': registration,
                  },
              }

          if research is None:
              research_out = {'http': 'ERROR'}
          else:
              accounts = research.get('accounts') or []
              as_of = [str(x.get('as_of')) for x in accounts if isinstance(x, dict) and x.get('as_of')]
              expected = research.get('expected_live_deviation') or {}
              research_out = {
                  'http': 'OK',
                  'generated_at': research.get('generated_at'),
                  'expected_generated_at': expected.get('generated_at') if isinstance(expected, dict) else None,
                  'latest_account_as_of': max(as_of) if as_of else None,
                  'scope': research.get('scope'),
                  'contains_secrets': research.get('contains_secrets'),
              }

          if health is None:
              health_out = {'http': 'ERROR'}
          else:
              health_out = {
                  'http': 'OK',
                  'generated_at': health.get('generated_at'),
                  'overall_status': health.get('overall_status'),
                  'scope': health.get('scope'),
                  'source': health.get('source'),
                  'components': health.get('components'),
                  'safety': health.get('safety'),
              }

          out = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'contains_secrets': False,
              'runtime_health': health_out,
              'v2': v2_out,
              'research': research_out,
          }
          pathlib.Path('runtime_diagnostic.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'v6-diagnostic-bot'
          git config user.email 'v6-diagnostic-bot@users.noreply.github.com'
          git add runtime_diagnostic.json
          git commit -m 'Update runtime diagnostic' || exit 0
          git push origin HEAD:snapshot-data

