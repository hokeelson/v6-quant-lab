name: Order state cleanup

on:
  push:
    branches: [main]
    paths:
      - tools/order_state_cleanup.py
      - .github/workflows/order-state-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch stale pending orders
        run: python tools/order_state_cleanup.py
      - name: Commit order state cleanup
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/simulation_engine.py)" ]; then
            echo "No order state changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation_engine.py
          git commit -m "Cancel stale pending buy and sell orders"
          git push origin HEAD:main
