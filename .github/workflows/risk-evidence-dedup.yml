name: Risk evidence dedup

on:
  push:
    branches: [main]
    paths:
      - tools/risk_evidence_dedup.py
      - .github/workflows/risk-evidence-dedup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Deduplicate overlapping realized evidence
        run: python tools/risk_evidence_dedup.py
      - name: Commit risk evidence dedup
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/risk_sizing.py storage_status_exporter.py)" ]; then
            echo "No risk evidence changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/risk_sizing.py storage_status_exporter.py
          git commit -m "Deduplicate overlapping realized risk evidence"
          git push origin HEAD:main
