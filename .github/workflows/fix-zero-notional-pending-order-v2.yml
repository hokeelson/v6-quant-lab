name: Fix zero-notional pending orders v2

on:
  push:
    branches: [main]
    paths:
      - tools/fix_zero_notional_pending_order.py
      - .github/workflows/fix-zero-notional-pending-order-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch pending-order cancellation
        run: python tools/fix_zero_notional_pending_order.py
      - name: Commit pending-order fix
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/simulation_db.py src/simulation_engine.py)" ]; then
            echo "No pending-order changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation_db.py src/simulation_engine.py
          git commit -m "Cancel zero-notional pending buy orders"
          git push origin HEAD:main
