name: Sync research snapshot

on:
  push:
    paths:
      - '.github/workflows/sync-research-snapshot.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-research-snapshot
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout snapshot branch
        uses: actions/checkout@v5
        with:
          ref: snapshot-data
          fetch-depth: 0

      - name: Fetch latest V6 research snapshot
        shell: bash
        run: |
          set -euo pipefail
          base='https://v6-quant-lab-production.up.railway.app/app/static'
          research_tmp="$(mktemp)"
          storage_tmp="$(mktemp)"
          sizing_tmp="$(mktemp)"
          expected_tmp="$(mktemp)"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --max-time 30 \
            "$base/research_snapshot.json" -o "$research_tmp"

          if ! curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 2 --max-time 15 \
            "$base/storage_persistence.json" -o "$storage_tmp"; then
            printf '%s\n' '{"status":"UNAVAILABLE","persistence_status":"UNKNOWN"}' > "$storage_tmp"
          fi

          if ! curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 2 --max-time 15 \
            "$base/risk_sizing_audit.json" -o "$sizing_tmp"; then
            printf '%s\n' '{"status":"UNAVAILABLE","scope":"PUBLIC_READ_ONLY_RISK_SIZING_AUDIT","contains_secrets":false,"summary":{"entries":0,"broker_order_api_calls":0},"entries":[]}' > "$sizing_tmp"
          fi

          expected_ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
              --max-time 15 "$base/expected_live_deviation.json" -o "$expected_tmp"; then
              expected_ok=1
              break
            fi
            echo "Expected-vs-live endpoint not ready (attempt ${attempt}/6)."
            sleep 10
          done
          if [ "$expected_ok" -ne 1 ]; then
            printf '%s\n' '{}' > "$expected_tmp"
          fi

          python - "$research_tmp" "$storage_tmp" "$sizing_tmp" "$expected_tmp" <<'PY'
          import json, math, pathlib, sys

          research_path = pathlib.Path(sys.argv[1])
          storage_path = pathlib.Path(sys.argv[2])
          sizing_path = pathlib.Path(sys.argv[3])
          expected_path = pathlib.Path(sys.argv[4])
          data = json.loads(research_path.read_text(encoding='utf-8'))

          if data.get('contains_secrets') is not False:
              raise SystemExit('Snapshot secret-safety flag missing or unsafe')
          if str(data.get('scope') or '') != 'PUBLIC_READ_ONLY_RESEARCH_SUMMARY':
              raise SystemExit('Unexpected snapshot scope')

          def finite(v):
              try:
                  x = float(v)
                  return x if math.isfinite(x) else None
              except Exception:
                  return None

          def derive_expected_live(snapshot):
              perf = {
                  str(r.get('performance_key') or ''): r
                  for r in (snapshot.get('strategy_symbol_performance') or [])
                  if isinstance(r, dict)
              }
              rows = []
              for m in snapshot.get('models') or []:
                  if not isinstance(m, dict):
                      continue
                  market = str(m.get('market') or '')
                  symbol = str(m.get('symbol') or '').upper()
                  horizon = str(m.get('horizon') or '')
                  strategy = str(m.get('strategy') or '')
                  key = f'{market}:{symbol}:{horizon}:{strategy}'
                  live = perf.get(key) or {}
                  oos = m.get('oos_metrics') or {}

                  n = int(live.get('closed_trades', 0) or 0)
                  live_win = finite(live.get('win_rate'))
                  live_pf = finite(live.get('profit_factor'))
                  live_avg = finite(live.get('avg_return_pct'))
                  live_total_est = None
                  if n > 0 and live_avg is not None and live_avg > -1.0:
                      try:
                          live_total_est = (1.0 + live_avg) ** n - 1.0
                      except Exception:
                          live_total_est = None

                  oos_n = int(oos.get('closed_trades', 0) or 0)
                  oos_win = finite(oos.get('win_rate'))
                  oos_pf = finite(oos.get('profit_factor'))
                  oos_total = finite(oos.get('total_return'))
                  oos_per_trade = None
                  if oos_n > 0 and oos_total is not None and oos_total > -1.0:
                      try:
                          oos_per_trade = (1.0 + oos_total) ** (1.0 / oos_n) - 1.0
                      except Exception:
                          oos_per_trade = None

                  raw = 0.0
                  reasons = []
                  if oos_total is not None and oos_total > 0 and live_total_est is not None and live_total_est < 0:
                      raw += 35.0
                      reasons.append('OOS_POSITIVE_LIVE_NEGATIVE')
                  if oos_win is not None and live_win is not None and (oos_win - live_win) > 0.15:
                      gap = oos_win - live_win
                      raw += min(25.0, 25.0 * gap / 0.30)
                      reasons.append('WIN_RATE_DETERIORATION')
                  if oos_pf is not None and oos_pf > 1.0 and live_pf is not None and live_pf < 1.0:
                      raw += min(25.0, 25.0 * max(0.0, oos_pf - live_pf) / max(oos_pf, 1.0))
                      reasons.append('PROFIT_FACTOR_DETERIORATION')
                  if oos_per_trade is not None and oos_per_trade > 0 and live_avg is not None and live_avg < 0:
                      raw += 20.0
                      reasons.append('EXPECTANCY_SIGN_REVERSAL')

                  evidence = min(1.0, n / 20.0)
                  score = min(100.0, raw * (0.35 + 0.65 * evidence))
                  if n < 5:
                      state, mult = 'LEARNING', 1.00
                  elif score >= 65:
                      state, mult = 'SEVERE_DIVERGENCE', 0.40
                  elif score >= 40:
                      state, mult = 'DIVERGING', 0.65
                  elif score >= 20:
                      state, mult = 'WATCH', 0.85
                  else:
                      state, mult = 'NORMAL', 1.00

                  rows.append({
                      'market': market,
                      'symbol': symbol,
                      'horizon': horizon,
                      'strategy': strategy,
                      'performance_key': key,
                      'live_closed_trades': n,
                      'live_win_rate': live_win,
                      'live_profit_factor': live.get('profit_factor'),
                      'live_avg_return': live_avg,
                      'live_compound_return_estimate': live_total_est,
                      'oos_closed_trades': oos_n,
                      'oos_win_rate': oos_win,
                      'oos_total_return': oos_total,
                      'oos_profit_factor': oos.get('profit_factor'),
                      'oos_sharpe': finite(oos.get('sharpe')),
                      'oos_max_drawdown': finite(oos.get('max_drawdown')),
                      'oos_per_trade_return': oos_per_trade,
                      'evidence_weight': evidence,
                      'deviation_score': score,
                      'state': state,
                      'suggested_confidence_multiplier': mult,
                      'reasons': reasons,
                      'shadow_only': True,
                  })
              rows.sort(key=lambda x: (x['deviation_score'], x['live_closed_trades']), reverse=True)
              return {
                  'status': 'AVAILABLE' if rows else 'UNAVAILABLE',
                  'scope': 'PUBLIC_READ_ONLY_EXPECTED_LIVE_DEVIATION',
                  'contains_secrets': False,
                  'shadow_only': True,
                  'active_sizing': False,
                  'source': 'AGGREGATE_FALLBACK',
                  'summary': {
                      'models': len(rows),
                      'with_live_trades': sum(1 for r in rows if r['live_closed_trades'] > 0),
                      'learning': sum(1 for r in rows if r['state'] == 'LEARNING'),
                      'watch': sum(1 for r in rows if r['state'] == 'WATCH'),
                      'diverging': sum(1 for r in rows if r['state'] == 'DIVERGING'),
                      'severe': sum(1 for r in rows if r['state'] == 'SEVERE_DIVERGENCE'),
                      'broker_order_api_calls': 0,
                  },
                  'rows': rows,
              }

          try:
              storage = json.loads(storage_path.read_text(encoding='utf-8'))
          except Exception:
              storage = {'status': 'UNAVAILABLE', 'persistence_status': 'UNKNOWN'}

          allowed = {
              'status', 'mode', 'persistence_status', 'last_snapshot_at',
              'last_snapshot_success', 'last_snapshot_failed',
              'snapshot_interval_seconds', 'snapshot_db_count',
              'snapshot_keep_archives', 'skipped_rebuildable', 'persistent_disk',
              'bootstrap_at', 'restored', 'bootstrap_warnings', 'updated_at'
          }
          if not isinstance(storage, dict):
              storage = {'status': 'UNAVAILABLE', 'persistence_status': 'UNKNOWN'}
          data['storage_persistence'] = {k: storage.get(k) for k in allowed if k in storage}
          if 'status' not in data['storage_persistence']:
              data['storage_persistence']['status'] = 'UNAVAILABLE'
          if 'persistence_status' not in data['storage_persistence']:
              data['storage_persistence']['persistence_status'] = 'UNKNOWN'

          try:
              sizing = json.loads(sizing_path.read_text(encoding='utf-8'))
          except Exception:
              sizing = None
          if (
              not isinstance(sizing, dict)
              or sizing.get('contains_secrets') is not False
              or str(sizing.get('scope') or '') != 'PUBLIC_READ_ONLY_RISK_SIZING_AUDIT'
          ):
              sizing = {
                  'status': 'UNAVAILABLE',
                  'scope': 'PUBLIC_READ_ONLY_RISK_SIZING_AUDIT',
                  'contains_secrets': False,
                  'summary': {'entries': 0, 'broker_order_api_calls': 0},
                  'entries': [],
              }
          data['risk_sizing_audit'] = sizing

          try:
              expected = json.loads(expected_path.read_text(encoding='utf-8'))
          except Exception:
              expected = None
          expected_valid = (
              isinstance(expected, dict)
              and expected.get('contains_secrets') is False
              and str(expected.get('scope') or '') == 'PUBLIC_READ_ONLY_EXPECTED_LIVE_DEVIATION'
              and str(expected.get('status') or '') == 'AVAILABLE'
          )
          if expected_valid:
              expected.setdefault('source', 'RUNTIME_EXACT')
          else:
              expected = derive_expected_live(data)
          data['expected_live_deviation'] = expected

          pathlib.Path('research_snapshot.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Commit snapshot to snapshot-data only
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- research_snapshot.json)" ]; then
            echo 'No snapshot changes.'
            exit 0
          fi
          git config user.name 'v6-snapshot-bot'
          git config user.email 'v6-snapshot-bot@users.noreply.github.com'
          git add research_snapshot.json
          git commit -m 'Update research snapshot'
          git push origin HEAD:snapshot-data
