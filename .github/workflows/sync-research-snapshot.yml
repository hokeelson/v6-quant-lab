name: Sync research snapshot

on:
  push:
    paths:
      - '.github/workflows/sync-research-snapshot.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-research-snapshot
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout snapshot branch
        uses: actions/checkout@v4
        with:
          ref: snapshot-data
          fetch-depth: 0

      - name: Fetch latest V6 research snapshot
        shell: bash
        run: |
          set -euo pipefail
          base='https://v6-quant-lab-production.up.railway.app/app/static'
          research_tmp="$(mktemp)"
          storage_tmp="$(mktemp)"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --max-time 30 \
            "$base/research_snapshot.json" -o "$research_tmp"

          if ! curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 2 --max-time 15 \
            "$base/storage_persistence.json" -o "$storage_tmp"; then
            printf '%s\n' '{"status":"UNAVAILABLE","persistence_status":"UNKNOWN"}' > "$storage_tmp"
          fi

          python - "$research_tmp" "$storage_tmp" <<'PY'
          import json, pathlib, sys

          research_path = pathlib.Path(sys.argv[1])
          storage_path = pathlib.Path(sys.argv[2])
          data = json.loads(research_path.read_text(encoding='utf-8'))

          if data.get('contains_secrets') is not False:
              raise SystemExit('Snapshot secret-safety flag missing or unsafe')
          if str(data.get('scope') or '') != 'PUBLIC_READ_ONLY_RESEARCH_SUMMARY':
              raise SystemExit('Unexpected snapshot scope')

          try:
              storage = json.loads(storage_path.read_text(encoding='utf-8'))
          except Exception:
              storage = {'status': 'UNAVAILABLE', 'persistence_status': 'UNKNOWN'}

          allowed = {
              'status', 'mode', 'persistence_status', 'last_snapshot_at',
              'last_snapshot_success', 'last_snapshot_failed',
              'snapshot_interval_seconds', 'snapshot_db_count',
              'snapshot_keep_archives', 'skipped_rebuildable', 'persistent_disk',
              'bootstrap_at', 'restored', 'bootstrap_warnings', 'updated_at'
          }
          if not isinstance(storage, dict):
              storage = {'status': 'UNAVAILABLE', 'persistence_status': 'UNKNOWN'}
          data['storage_persistence'] = {k: storage.get(k) for k in allowed if k in storage}
          if 'status' not in data['storage_persistence']:
              data['storage_persistence']['status'] = 'UNAVAILABLE'
          if 'persistence_status' not in data['storage_persistence']:
              data['storage_persistence']['persistence_status'] = 'UNKNOWN'

          pathlib.Path('research_snapshot.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Commit snapshot to snapshot-data only
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- research_snapshot.json)" ]; then
            echo 'No snapshot changes.'
            exit 0
          fi
          git config user.name 'v6-snapshot-bot'
          git config user.email 'v6-snapshot-bot@users.noreply.github.com'
          git add research_snapshot.json
          git commit -m 'Update research snapshot'
          git push origin HEAD:snapshot-data
