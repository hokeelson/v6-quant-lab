name: Sync runtime snapshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-runtime-snapshots.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-runtime-snapshots
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout snapshot branch
        uses: actions/checkout@v5
        with:
          ref: snapshot-data
          fetch-depth: 0

      - name: Fetch and validate Crypto Lite runtime snapshots
        shell: bash
        run: |
          set -euo pipefail
          base='https://v6-quant-lab-production.up.railway.app/app/static'
          health_tmp="$(mktemp)"
          storage_tmp="$(mktemp)"
          sizing_tmp="$(mktemp)"
          expected_tmp="$(mktemp)"
          external_tmp="$(mktemp)"

          if ! curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --max-time 30             "$base/runtime_health.json" -o "$health_tmp"; then
            echo 'Runtime health temporarily unavailable; keeping previous snapshot and exiting successfully.'
            exit 0
          fi

          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 15             "$base/storage_persistence.json" -o "$storage_tmp" || printf '%s\n' '{}' > "$storage_tmp"
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 15             "$base/risk_sizing_audit.json" -o "$sizing_tmp" || printf '%s\n' '{}' > "$sizing_tmp"
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 15             "$base/expected_live_deviation.json" -o "$expected_tmp" || printf '%s\n' '{}' > "$expected_tmp"
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 15             "$base/daily_external_intelligence.json" -o "$external_tmp" || printf '%s\n' '{}' > "$external_tmp"

          python - "$health_tmp" "$storage_tmp" "$sizing_tmp" "$expected_tmp" "$external_tmp" <<'PY'
          import json, pathlib, sys
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)

          def load(path):
              try:
                  value = json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
                  return value if isinstance(value, dict) else {}
              except Exception:
                  return {}

          def utc_dt(value):
              if not value:
                  return None
              dt = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          health = load(sys.argv[1])
          storage = load(sys.argv[2])
          sizing = load(sys.argv[3])
          expected = load(sys.argv[4])
          external = load(sys.argv[5])

          if health.get('contains_secrets') is not False:
              raise SystemExit('Runtime health secret-safety flag missing or unsafe')
          if str(health.get('scope') or '') != 'PUBLIC_READ_ONLY_RUNTIME_HEALTH':
              raise SystemExit('Unexpected runtime health scope')
          health_generated = utc_dt(health.get('generated_at'))
          if health_generated is None:
              raise SystemExit('Runtime health generated_at missing')
          health_age = max(0.0, (now - health_generated).total_seconds())
          if health_age > 60:
              raise SystemExit(f'Runtime health heartbeat is stale: {health_age:.1f}s old')
          safety = health.get('safety') if isinstance(health.get('safety'), dict) else {}
          if int(safety.get('broker_order_api_calls', -1)) != 0:
              raise SystemExit('Runtime health broker API safety invariant violated')

          health['sync_checked_at'] = now.isoformat()
          health['sync_snapshot_age_seconds'] = health_age
          pathlib.Path('runtime_health.json').write_text(
              json.dumps(health, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False) + '\n',
              encoding='utf-8'
          )

          # Storage progress fields remain part of the public backup contract:
          # current_snapshot_db, current_snapshot_phase, current_snapshot_progress
          optional = [
              ('storage_persistence.json', storage),
              ('risk_sizing_audit.json', sizing),
              ('expected_live_deviation.json', expected),
          ]
          for filename, payload in optional:
              if not payload or payload.get('contains_secrets') is not False:
                  continue
              pathlib.Path(filename).write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False) + '\n',
                  encoding='utf-8'
              )

          external_ok = (
              external.get('contains_secrets') is False
              and str(external.get('scope') or '') == 'PUBLIC_READ_ONLY_DAILY_EXTERNAL_INTELLIGENCE'
              and int(external.get('broker_order_api_calls', -1)) == 0
          )
          external_generated = utc_dt(external.get('generated_at')) if external_ok else None
          external_age = max(0.0, (now - external_generated).total_seconds()) if external_generated else None
          if external_ok and external_age is not None and external_age <= 43200:
              external['sync_checked_at'] = now.isoformat()
              external['sync_snapshot_age_seconds'] = external_age
              pathlib.Path('daily_external_intelligence.json').write_text(
                  json.dumps(external, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False) + '\n',
                  encoding='utf-8'
              )
          PY

      - name: Commit snapshots together
        shell: bash
        run: |
          set -euo pipefail
          files='runtime_health.json storage_persistence.json risk_sizing_audit.json expected_live_deviation.json daily_external_intelligence.json'
          changed=()
          for file in $files; do
            if [ -e "$file" ] && [ -n "$(git status --porcelain -- "$file")" ]; then
              changed+=("$file")
            fi
          done
          if [ "${#changed[@]}" -eq 0 ]; then
            echo 'No runtime snapshot changes.'
            exit 0
          fi
          git config user.name 'v6-snapshot-bot'
          git config user.email 'v6-snapshot-bot@users.noreply.github.com'
          git add -- "${changed[@]}"
          git commit -m 'Update Crypto Lite runtime snapshots'

          for attempt in 1 2 3; do
            git pull --rebase origin snapshot-data
            if git push origin HEAD:snapshot-data; then
              exit 0
            fi
            echo "snapshot-data moved during push (attempt $attempt/3); retrying."
            sleep 5
          done
          echo 'Unable to update runtime snapshots after retries.' >&2
          exit 1
