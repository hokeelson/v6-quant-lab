name: Stabilize execution core

on:
  push:
    branches: [main]
    paths:
      - 'tools/stabilize_execution_core.py'
      - '.github/workflows/stabilize-execution-core.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply stabilization patch
        run: python tools/stabilize_execution_core.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q
      - name: Commit stabilized core
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/simulation_db.py src/simulation_engine.py src/twstock_support.py storage_rescue.py tests/test_simulation_execution_safety.py .github/workflows/ci.yml
          git commit -m 'Stabilize simulation execution core'
          git push
