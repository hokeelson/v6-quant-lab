name: Streamlit compatibility cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/streamlit-compat-cleanup.yml"
      - "tools/streamlit_compat_cleanup.py"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Modernize deprecated Streamlit width API
        run: python tools/streamlit_compat_cleanup.py

      - name: Commit source cleanup
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- '*.py')" ]; then
            echo "No Streamlit width compatibility changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.py'
          git commit -m "Modernize Streamlit width API"
          git push origin HEAD:main
